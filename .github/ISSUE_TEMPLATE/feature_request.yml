name: 功能建议
description: 提议新的能力或交互改进
title: "[Feature] "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: 使用场景
      description: 你遇到了什么问题？现有操作为什么无法满足需求？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 描述你期望的操作方式或结果。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
      description: 如有，请说明目前的变通方法或其他设计选择。
  - type: textarea
    id: examples
    attributes:
      label: 示例或参考
      description: 可附脱敏后的示意图、演示文稿或相关链接。
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索现有 Issue，未发现相同建议。
          required: true

